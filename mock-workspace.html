<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Facet — workspace mock</title>
<style>
  :root{
    --text-1:#E9EEF4; --text-2:#9AA7B6; --text-3:#5E6B7A;
    --accent:#7DE2C3; --selection:#FFB65C;
  }
  html,body{margin:0;padding:0;background:transparent;}
  *{box-sizing:border-box;}
  body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text-1);}
  .frame{
    position:relative;height:540px;border-radius:18px;overflow:hidden;
    background:
      radial-gradient(120% 90% at 38% 30%, #1B2A38 0%, #0E131A 45%, #06080B 100%);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 30px 80px -30px rgba(0,0,0,.9);
  }
  .frame:after{ /* vignette */
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(90% 70% at 50% 55%, transparent 40%, rgba(0,0,0,.45) 100%);
  }
  #stage{position:absolute;inset:0;}
  svg{display:block;width:100%;height:100%;}

  .glass{
    background:rgba(255,255,255,.045);
    -webkit-backdrop-filter:blur(28px) saturate(150%);
    backdrop-filter:blur(28px) saturate(150%);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18), inset 0 -1px 0 rgba(0,0,0,.35), 0 24px 60px -16px rgba(0,0,0,.65);
    border-radius:20px;
  }

  .top{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:999px;
    font-size:12px;white-space:nowrap;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
  .fname{font-weight:520;letter-spacing:.01em;}
  .sep{width:1px;height:14px;background:rgba(255,255,255,.12);}
  .meta{color:var(--text-2);font-variant-numeric:tabular-nums;font-size:11.5px;}
  .unit{padding:2px 7px;border-radius:999px;border:1px solid rgba(255,255,255,.12);color:var(--text-2);font-size:10.5px;}
  .icobtn{width:24px;height:24px;display:grid;place-items:center;border-radius:8px;color:var(--text-2);}
  .icobtn:hover{background:rgba(255,255,255,.08);color:var(--text-1);}

  .rail{position:absolute;left:14px;top:50%;transform:translateY(-50%);padding:8px;display:flex;flex-direction:column;gap:6px;}
  .tool{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--text-2);}
  .tool.active{color:#0B1410;background:linear-gradient(160deg,#8FEBCE,#5FD0E8);box-shadow:0 6px 18px -6px rgba(125,226,195,.7);}
  .tool:not(.active):hover{background:rgba(255,255,255,.07);color:var(--text-1);}

  .inspector{
    position:absolute;right:14px;top:14px;bottom:14px;width:248px;padding:16px 16px 12px;
    display:flex;flex-direction:column;gap:14px;border-radius:20px;
  }
  .ph{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);}
  .row{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--text-1);}
  .val{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-variant-numeric:tabular-nums;color:var(--text-1);}
  .val small{color:var(--text-3);font-size:10.5px;margin-left:3px;}
  .track{position:relative;height:26px;display:flex;align-items:center;}
  .rail2{position:absolute;left:0;right:0;height:3px;border-radius:2px;background:rgba(255,255,255,.10);}
  .fill{position:absolute;left:0;height:3px;border-radius:2px;background:linear-gradient(90deg,rgba(125,226,195,.5),var(--accent));}
  .thumb{position:absolute;width:14px;height:14px;border-radius:50%;background:#F4FAF8;box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 0 4px rgba(125,226,195,.16);transform:translateX(-7px);}
  .seg{display:flex;gap:4px;margin-top:2px;}
  .seg i{flex:1;height:26px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--text-3);font-family:"JetBrains Mono",monospace;}
  .seg i.on{background:rgba(125,226,195,.12);border-color:rgba(125,226,195,.45);color:#CFF7EA;}
  .warn{display:flex;gap:8px;align-items:flex-start;font-size:11px;line-height:1.4;color:#FFD9A6;background:rgba(255,196,107,.10);border:1px solid rgba(255,196,107,.22);padding:8px 10px;border-radius:12px;}
  .btn{margin-top:auto;height:34px;border-radius:12px;display:grid;place-items:center;font-size:12.5px;font-weight:560;color:#06120E;
    background:linear-gradient(160deg,#8FEBCE,#5FD0E8);box-shadow:0 10px 24px -12px rgba(125,226,195,.9);}
  .chips{position:absolute;left:14px;bottom:14px;display:flex;gap:8px;}
  .chip{padding:7px 11px;border-radius:999px;font-size:11px;color:var(--text-2);font-variant-numeric:tabular-nums;}
  .chip b{color:#FFD9A6;font-weight:560;}
  .hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:10.5px;color:var(--text-3);letter-spacing:.02em;white-space:nowrap;}
  .hint kbd{font-family:inherit;color:var(--text-2);border:1px solid rgba(255,255,255,.14);border-radius:5px;padding:1px 4px;font-size:10px;}
  .gizmo{position:absolute;right:276px;bottom:16px;width:44px;height:44px;border-radius:12px;}
  .e{stroke:rgba(255,255,255,.10);stroke-width:1;fill:none;}
  .e.sel{stroke:rgba(255,182,92,.35);stroke-width:6;stroke-linecap:round;}
  .e.sel2{stroke:#FFB65C;stroke-width:1.7;stroke-linecap:round;}
  .e.hov{stroke:rgba(255,255,255,.55);stroke-width:1.4;}
</style>
</head>
<body>
<div class="frame">
  <div id="stage"><svg id="svg" viewBox="0 0 720 540" preserveAspectRatio="xMidYMid meet"></svg></div>

  <div class="top glass">
    <span class="dot"></span>
    <span class="fname">Desk_Hook_v3.stl</span>
    <span class="sep"></span>
    <span class="meta">140 tri</span>
    <span class="unit">mm</span>
    <span class="sep"></span>
    <span class="icobtn">↶</span>
    <span class="icobtn" style="opacity:.35">↷</span>
    <span class="icobtn">⋯</span>
  </div>

  <div class="rail glass">
    <div class="tool active">▣</div>
    <div class="tool">✎</div>
    <div class="tool">◇</div>
  </div>

  <div class="inspector glass">
    <div class="ph"><span>Bevel</span><span style="color:var(--text-2)">⌄</span></div>

    <div>
      <div class="row"><span>Width</span><span class="val">0.50<small>mm</small></span></div>
      <div class="track">
        <div class="rail2"></div>
        <div class="fill" style="width:42%"></div>
        <div class="thumb" style="left:42%"></div>
      </div>
    </div>

    <div>
      <div class="row"><span>Segments</span><span class="val">4</span></div>
      <div class="seg"><i>1</i><i>2</i><i>3</i><i class="on">4</i><i>6</i><i>8</i></div>
    </div>

    <div>
      <div class="row"><span>Profile</span><span class="val">0.50</span></div>
      <div class="track">
        <div class="rail2"></div>
        <div class="fill" style="width:50%"></div>
        <div class="thumb" style="left:50%"></div>
      </div>
    </div>

    <div class="warn"><span>⚠</span><span>Width limited to 0.50 mm — 2 edges are narrower.</span></div>

    <div class="ph" style="margin-top:2px"><span>Mesh</span><span style="color:var(--success,#63E6A8);text-transform:none;letter-spacing:0;font-size:11px">watertight ✓</span></div>
    <div class="row" style="font-size:11.5px;color:var(--text-2)"><span>Volume</span><span class="val" style="color:var(--text-2)">12 788 mm³</span></div>

    <div class="btn">Export STL</div>
  </div>

  <div class="chips">
    <div class="chip glass">14 edges · 2 chains</div>
    <div class="chip glass">0.50 × 4</div>
  </div>

  <div class="gizmo glass"></div>
  <div class="hint">click to keep · <kbd>shift</kbd> add · <kbd>alt</kbd> remove · drag to paint · <kbd>C</kbd> compare</div>
</div>

<script>
const P = [
 [15.145,35.257],[12.876,35.257],[12.265,33.316],[12.265,-0.071],[-32.735,-0.071],
 [-32.735,-3.071],[-32.598,-4.649],[-32.507,-6.228],[-31.946,-9.436],[-31.022,-12.534],
 [-29.749,-15.468],[-28.151,-18.188],[-26.255,-20.647],[-24.092,-22.804],[-21.700,-24.621],
 [-19.121,-26.068],[-16.980,-26.894],[-16.980,-21.926],[-18.471,-20.870],[-19.503,-20.292],
 [-21.416,-18.838],[-23.147,-17.112],[-24.664,-15.144],[-25.943,-12.968],[-26.961,-10.621],
 [-27.700,-8.142],[-28.149,-5.575],[-28.294,-3.071],[15.145,-3.071]
];
const H = 35, C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
const raw = P.map(([x,y]) => [ (x - y) * C, (x + y) * S ]);
const top = raw.map(([a,b]) => [a, b - H]);
let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
for (const [a,b] of raw.concat(top)) { minx=Math.min(minx,a);maxx=Math.max(maxx,a);miny=Math.min(miny,b);maxy=Math.max(maxy,b); }
const svg = document.getElementById('svg');
const W=720, Hh=540, pad=70;
const k = Math.min((W-2*pad)/(maxx-minx), (Hh-2*pad)/(maxy-miny));
const ox = W/2 - k*(minx+maxx)/2, oy = Hh/2 - k*(miny+maxy)/2;
const T = ([a,b]) => [ox + a*k, oy + b*k];

const ns='http://www.w3.org/2000/svg';
const el=(n,at)=>{const e=document.createElementNS(ns,n);for(const k in at)e.setAttribute(k,at[k]);return e;};
const L = [ -0.35, -0.55, 0.76 ];
const cen = raw.reduce((s,p)=>[s[0]+p[0]/raw.length, s[1]+p[1]/raw.length],[0,0]);

let g = el('g',{});
// bottom cap
g.appendChild(el('polygon',{points: raw.map(T).map(p=>p.join(',')).join(' '), fill:'#0B1015', stroke:'none'}));
// side walls
for (let i=0;i<P.length;i++){
  const j=(i+1)%P.length;
  const a=raw[i], b=raw[j];
  const e=[b[0]-a[0], b[1]-a[1]];
  let n=[e[1], -e[0]];
  const len=Math.hypot(n[0],n[1])||1; n=[n[0]/len,n[1]/len];
  const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
  if ((mid[0]-cen[0])*n[0]+(mid[1]-cen[1])*n[1] < 0) n=[-n[0],-n[1]];
  const lam = Math.max(0, n[0]*L[0] + n[1]*L[1]);
  const tone = 0.30 + 0.55*lam;
  const col = `rgb(${Math.round(22+tone*46)},${Math.round(30+tone*52)},${Math.round(38+tone*58)})`;
  const q=[T(a),T(b),T(top[j]),T(top[i])].map(p=>p.join(',')).join(' ');
  g.appendChild(el('polygon',{points:q, fill:col, stroke:'none'}));
}
// vertical edges
for (let i=0;i<P.length;i++){
  const a=T(raw[i]), b=T(top[i]);
  g.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1], class:'e'}));
}
// top cap
const topPoly = top.map(T).map(p=>p.join(',')).join(' ');
g.appendChild(el('polygon',{points:topPoly, fill:'#2A3642', stroke:'rgba(255,255,255,.16)', 'stroke-width':1}));
// profile shading lines on cap (fake arc), plus selected rim
for (let i=0;i<P.length;i++){
  const j=(i+1)%P.length;
  const a=T(top[i]), b=T(top[j]);
  const selected = i<=11;
  if (selected){
    g.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1], class:'e sel'}));
    g.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1], class:'e sel2'}));
  } else if (i===13){
    g.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1], class:'e hov'}));
  } else {
    g.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1], class:'e'}));
  }
}
// a couple of selected vertical edges
[2,3,16,17].forEach(i=>{
  const a=T(raw[i]), b=T(top[i]);
  g.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1], class:'e sel'}));
  g.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1], class:'e sel2'}));
});
svg.appendChild(g);
</script>
</body>
</html>
